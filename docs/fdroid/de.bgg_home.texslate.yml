AutoName: TeXslate

RepoType: git
Repo: https://github.com/thobgg/TeXslate.git
Binaries: https://github.com/thobgg/TeXslate/releases/download/v%v/TeXslate-%v-core-arm64-v8a.apk

Builds:
  - versionName: 1.0-alpha22
    versionCode: 22
    commit: ed0d9113d90a29b0b10c76cf3f64c71ba81657d8
    subdir: app
    sudo:
      - apt-get update
      - apt-get install -y cmake ninja-build pkg-config autoconf automake libtool-bin
        bison gperf autoconf-archive
    gradle:
      - core
    prebuild:
      - cd ..
      - sed -i -e '/foojay/d' settings.gradle.kts
      - sed -i 's/include("arm64-v8a", "x86_64")/include("arm64-v8a")/' app/build.gradle.kts
      - rustup target add aarch64-linux-android
      - cargo install cargo-ndk --version 3.5.4 --locked
      - git clone --branch 2026.06.24 --depth 1 https://github.com/microsoft/vcpkg
        vcpkg
      - ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
      - export VCPKG_ROOT="$(pwd)/vcpkg" && ./vcpkg/vcpkg install --triplet arm64-android
        "harfbuzz[core,freetype,graphite2,icu,png]" freetype graphite2 icu libpng
        fontconfig
      - export VCPKG_ROOT="$(pwd)/vcpkg" && ./build-native.sh arm64-v8a
    scanignore:
      - app/src/main/jniLibs
    scandelete:
      - vcpkg
      - rust/target
    ndk: 27.2.12479018

