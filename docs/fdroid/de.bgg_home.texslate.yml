AntiFeatures:
  NonFreeNet:
    en-US: The optional AI assistant sends text to Anthropic, OpenAI or Google using
      an API key supplied by the user. It is disabled by default; the editor and the
      LaTeX compiler work fully offline.
Categories:
  - Writing
License: GPL-3.0-or-later
AuthorName: thobgg
SourceCode: https://github.com/thobgg/TeXslate
IssueTracker: https://github.com/thobgg/TeXslate/issues

AutoName: TeXslate

RepoType: git
Repo: https://github.com/thobgg/TeXslate.git
Binaries: https://github.com/thobgg/TeXslate/releases/download/v%v/TeXslate-%v-core-arm64-v8a.apk

Builds:
  - versionName: 1.0-alpha23
    versionCode: 23
    commit: PLATZHALTER_COMMIT_ALPHA23
    subdir: app
    sudo:
      - apt-get update
      - apt-get install -y cmake ninja-build pkg-config autoconf automake libtool-bin
        bison gperf autoconf-archive
    gradle:
      - core
    srclibs:
      - vcpkg@2026.06.24
    prebuild:
      - cd ..
      - sed -i -e '/foojay/d' settings.gradle.kts
      - sed -i 's/include("arm64-v8a", "x86_64")/include("arm64-v8a")/' app/build.gradle.kts
      - cargo install cargo-ndk --version 3.5.4 --locked
      - $$vcpkg$$/bootstrap-vcpkg.sh -disableMetrics
      - VCPKG_ROOT=$$vcpkg$$ $$vcpkg$$/vcpkg install --triplet arm64-android "harfbuzz[core,freetype,graphite2,icu,png]"
        freetype graphite2 icu libpng fontconfig
      - printf 'vcpkgRoot=%s\n' $$vcpkg$$ >> gradle.properties
    ndk: 27.2.12479018

AutoUpdateMode: Version v%v
UpdateCheckMode: Tags
