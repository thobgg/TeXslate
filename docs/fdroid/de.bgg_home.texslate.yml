AntiFeatures:
  NonFreeNet:
    en-US: The optional AI assistant sends text to Anthropic, OpenAI or Google using
      an API key supplied by the user. It is disabled by default; the editor and the
      LaTeX compiler work fully offline.
Categories:
  - Writing
License: GPL-3.0-or-later
AuthorName: thobgg
SourceCode: https://github.com/thobgg/TeXslate
IssueTracker: https://github.com/thobgg/TeXslate/issues

RepoType: git
Repo: https://github.com/thobgg/TeXslate.git

Builds:
  - versionName: 1.0-alpha19
    versionCode: 19
    commit: v1.0-alpha19
    sudo:
      - apt-get update
      - apt-get install -y cmake ninja-build pkg-config autoconf automake libtool-bin
        bison gperf autoconf-archive
    gradle:
      - core
    prebuild:
      - sed -i -e '/foojay/d' settings.gradle.kts
      - sed -i 's/include("arm64-v8a", "x86_64")/include("arm64-v8a")/' app/build.gradle.kts
      - rustup target add aarch64-linux-android
      - cargo install cargo-ndk --version 3.5.4 --locked
      - git clone --branch 2026.06.24 --depth 1 https://github.com/microsoft/vcpkg
        vcpkg
      - ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
      - export VCPKG_ROOT="$(pwd)/vcpkg" && ./vcpkg/vcpkg install --triplet arm64-android
        "harfbuzz[core,freetype,graphite2,icu,png]" freetype graphite2 icu libpng
        fontconfig
      - export VCPKG_ROOT="$(pwd)/vcpkg" && ./build-native.sh arm64-v8a
    scanignore:
      - app/src/main/jniLibs
    scandelete:
      - vcpkg
      - rust/target
    ndk: 27.2.12479018

AutoUpdateMode: Version v%v
UpdateCheckMode: Tags
CurrentVersion: 1.0-alpha19
CurrentVersionCode: 19
