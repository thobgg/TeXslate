Builds:
  - versionName: 1.0-alpha23
    versionCode: 23
    commit: v1.0-alpha23
    subdir: app
    sudo:
      - apt-get update
      - apt-get install -y rustup build-essential cmake ninja-build pkg-config autoconf
        automake libtool-bin bison flex gettext gperf autoconf-archive zip
    gradle:
      - core
    srclibs:
      - vcpkg@2026.06.24
    prebuild:
      - sed -i -e '/foojay/d' ../settings.gradle.kts
      - sed -i 's/include("arm64-v8a", "x86_64")/include("arm64-v8a")/' build.gradle.kts
    build:
      - cd ..
      - export RUST_VERSION=$(sed -n -E 's/channel = "(.*)"/\1/p' rust-toolchain.toml)
      - rustup default $RUST_VERSION
      - rustup target add aarch64-linux-android
      - cargo install cargo-ndk --version 3.5.4 --locked
      - $$vcpkg$$/bootstrap-vcpkg.sh -disableMetrics
      - VCPKG_ROOT=$$vcpkg$$ $$vcpkg$$/vcpkg install --triplet arm64-android "harfbuzz[core,freetype,graphite2,icu,png]"
        freetype graphite2 icu libpng fontconfig
      - cd rust && cargo fetch --target aarch64-linux-android && cd ..
      - VCPKG_ROOT=$$vcpkg$$ ./build-native.sh arm64-v8a
    ndk: 27.2.12479018

